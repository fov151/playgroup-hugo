{{ define "main" }}
<div class="list-page">
  <header class="page-hero container">
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
  </header>
  <div class="container">
    <div class="news-grid">
      {{ range .Pages }}
      <article class="news-card">
        {{ with .Params.emoji }}<div class="news-emoji" aria-hidden="true">{{ . }}</div>{{ end }}
        <div class="news-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
        </div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Summary | truncate 140 }}</p>
        <a href="{{ .RelPermalink }}" class="read-more">Read more &rarr;</a>
      </article>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
